name: Build signed release candidate
run-name: Candidate ${{ inputs.release_tag }} request ${{ inputs.request_id }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag matching app/build.gradle.kts (for example v0.8.32)
        required: true
        type: string
      request_id:
        description: Unique local request ID used to identify this dispatch
        required: false
        default: manual
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  KEYSTORE_PATH: ${{ github.workspace }}/keystore.p12
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  EXPECTED_SIGNING_CERT_SHA256: c33027eef9607dcf592ac7f8fefe47961e728c349541c3fa23c99355e2edbcc1
  SPLITS_INCLUDE: "TRUE"
  RELEASE_OUTPUT_DIR: app/build/outputs/apk/release
  CANDIDATE_MANIFEST: app/build/outputs/apk/release/release-candidate-manifest.json

jobs:
  build-candidate:
    name: Build immutable signed candidate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test release artifact tooling
        run: python3 -m unittest discover -s .github/scripts -p 'test_release_*.py' -v

      - name: Verify dispatch source and release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          expected_ref="refs/heads/$DEFAULT_BRANCH"
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
            echo "::error::Release candidates must be dispatched from $expected_ref, got $GITHUB_REF"
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release_tag must use vMAJOR.MINOR.PATCH"
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::error::Tag already exists: $RELEASE_TAG"
            exit 1
          fi

          if release_lookup="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1)"; then
            echo "::error::GitHub Release already exists: $RELEASE_TAG"
            exit 1
          elif [[ "$release_lookup" != *"HTTP 404"* ]]; then
            echo "::error::Unable to prove that Release $RELEASE_TAG is absent"
            printf '%s\n' "$release_lookup"
            exit 1
          fi

          version_name="$(
            awk -F'"' '/^[[:space:]]*val baseVersionName = / { print $2; exit }' app/build.gradle.kts
          )"
          current_raw="$(
            awk '/^[[:space:]]*val baseVersionCode = / { print $4; exit }' app/build.gradle.kts
          )"
          if [[ -z "$version_name" || -z "$current_raw" ]]; then
            echo "::error::Unable to read release version from app/build.gradle.kts"
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$version_name" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match versionName $version_name"
            exit 1
          fi

          current_base="${current_raw//_/}"
          historical_floor=1786376603
          required_floor="$historical_floor"
          previous_tag="$(
            git tag --merged "$GITHUB_SHA" --list 'v[0-9]*' --sort=-version:refname |
              head -n 1
          )"
          if [[ -n "$previous_tag" ]]; then
            previous_raw="$(
              git show "$previous_tag:app/build.gradle.kts" |
                awk '/^[[:space:]]*val baseVersionCode = / { print $4; exit }'
            )"
            if [[ -z "$previous_raw" ]]; then
              echo "::error::Unable to read baseVersionCode from previous tag $previous_tag"
              exit 1
            fi
            previous_max=$((${previous_raw//_/} + 4))
            if (( previous_max > required_floor )); then
              required_floor="$previous_max"
            fi
          fi

          commit_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          if (( current_base <= required_floor )); then
            echo "::error::Release baseVersionCode $current_base must be greater than prior maximum $required_floor"
            exit 1
          fi
          if (( current_base <= commit_epoch )); then
            echo "::error::Release baseVersionCode $current_base must be greater than source commit epoch $commit_epoch"
            exit 1
          fi
          if (( current_base + 4 > 2100000000 )); then
            echo "::error::Release ABI versionCode exceeds Android's 2100000000 limit"
            exit 1
          fi

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "base_version_code=$current_base" >> "$GITHUB_OUTPUT"
          echo "Release metadata verified: tag=$RELEASE_TAG base=$current_base source=$GITHUB_SHA"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Decode and verify release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          for variable in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Missing required release secret: $variable"
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null

          actual_fingerprint="$({
            keytool -exportcert \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS"
          } | sha256sum | awk '{print $1}')"
          if [[ "$actual_fingerprint" != "$EXPECTED_SIGNING_CERT_SHA256" ]]; then
            echo "::error::Release keystore certificate mismatch: $actual_fingerprint"
            exit 1
          fi
          echo "Release keystore verified: $actual_fingerprint"

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: false

      - name: Test and build signed release APKs once
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --console=plain testDiagnosticUnitTest lintDiagnostic assembleRelease

      - name: Verify signed APK identity and versions
        env:
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          BASE_VERSION_CODE: ${{ steps.metadata.outputs.base_version_code }}
        shell: bash
        run: |
          set -euo pipefail

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [[ -z "$apksigner" || -z "$aapt" ]]; then
            echo "::error::Android APK verification tools were not found"
            exit 1
          fi

          declare -A offsets=(
            [app-universal-release.apk]=0
            [app-armeabi-v7a-release.apk]=1
            [app-arm64-v8a-release.apk]=2
            [app-x86-release.apk]=3
            [app-x86_64-release.apk]=4
          )
          mapfile -t actual_names < <(
            find "$RELEASE_OUTPUT_DIR" -maxdepth 1 -type f -name '*.apk' -printf '%f\n' | sort
          )
          mapfile -t expected_names < <(printf '%s\n' "${!offsets[@]}" | sort)
          if [[ "${actual_names[*]}" != "${expected_names[*]}" ]]; then
            echo "::error::Release APK filename set mismatch"
            printf 'Expected: %s\nActual: %s\n' "${expected_names[*]}" "${actual_names[*]}"
            exit 1
          fi

          for name in "${expected_names[@]}"; do
            apk="$RELEASE_OUTPUT_DIR/$name"
            certificate_report="$("$apksigner" verify --verbose --print-certs "$apk" 2>&1)"
            normalized_report="$(
              printf '%s' "$certificate_report" |
                tr -d ':\r\n' |
                tr '[:upper:]' '[:lower:]'
            )"
            if [[ "$normalized_report" != *"$EXPECTED_SIGNING_CERT_SHA256"* ]]; then
              echo "::error::APK signing certificate mismatch for $name"
              exit 1
            fi

            badging="$("$aapt" dump badging "$apk")"
            expected_code=$((BASE_VERSION_CODE + offsets[$name]))
            if [[ "$badging" != *"name='com.surfsave.browser'"* ]]; then
              echo "::error::APK applicationId mismatch for $name"
              exit 1
            fi
            if [[ "$badging" != *"versionName='$VERSION_NAME'"* ]]; then
              echo "::error::APK versionName mismatch for $name"
              exit 1
            fi
            if [[ "$badging" != *"versionCode='$expected_code'"* ]]; then
              echo "::error::APK versionCode mismatch for $name; expected $expected_code"
              exit 1
            fi
            echo "Verified $name versionCode=$expected_code"
          done

      - name: Create and re-verify immutable candidate manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          BASE_VERSION_CODE: ${{ steps.metadata.outputs.base_version_code }}
        shell: bash
        run: |
          set -euo pipefail
          common=(
            --apk-dir "$RELEASE_OUTPUT_DIR"
            --repository "$GITHUB_REPOSITORY"
            --run-id "$GITHUB_RUN_ID"
            --source-sha "$GITHUB_SHA"
            --source-ref "$GITHUB_REF"
            --tag "$RELEASE_TAG"
            --certificate-sha256 "$EXPECTED_SIGNING_CERT_SHA256"
          )
          python3 .github/scripts/release_manifest.py create \
            "${common[@]}" \
            --version-name "$VERSION_NAME" \
            --base-version-code "$BASE_VERSION_CODE" \
            --output "$CANDIDATE_MANIFEST"
          python3 .github/scripts/release_manifest.py verify \
            "${common[@]}" \
            --manifest "$CANDIDATE_MANIFEST"

      - name: Upload immutable release candidate
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/release-candidate-manifest.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Write candidate summary
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        shell: bash
        run: |
          {
            echo "## Signed release candidate"
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Source: \`$GITHUB_SHA\`"
            echo "- Candidate run ID: \`$GITHUB_RUN_ID\`"
            echo "- Artifact: $ARTIFACT_URL"
            echo
            echo "Download and test this candidate. Promotion must reuse run \`$GITHUB_RUN_ID\` without rebuilding."
          } >> "$GITHUB_STEP_SUMMARY"
