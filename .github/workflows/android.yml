name: Android CI

on:
  push:
    branches:
      - main
      - dev
      - master
  pull_request:

jobs:
  verify:
    name: Diagnostic verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup target add --toolchain 1.98.0 \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android
          rustc --version
          cargo --version

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test release artifact tooling
        run: python3 -m unittest discover -s .github/scripts -p 'test_release_*.py' -v

      - name: Test, build diagnostic APK, and lint
        run: ./gradlew --console=plain -PSKIP_GO_BUILD=true testDiagnosticUnitTest assembleDiagnostic lintDiagnostic

      - name: Verify native libraries in diagnostic APKs
        run: >-
          python3 .github/scripts/verify_native_libs.py
          --apk-dir app/build/outputs/apk/diagnostic
          --variant diagnostic

      - name: Upload diagnostic APKs
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-apks
          path: app/build/outputs/apk/diagnostic/*.apk
